services:
  api:
    build: .
    container_name: reverse-proxy-fastapi-api
    restart: always

  nginx:
    image: nginx:alpine
    container_name: reverse-proxy-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    restart: always
